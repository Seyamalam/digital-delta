version: v2
clean: true
plugins:
  - local: protoc-gen-go
    out: ../../services/node/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-go-grpc
    out: ../../services/node/gen
    opt:
      - paths=source_relative
  - local: ../../apps/command/node_modules/.bin/protoc-gen-es
    out: ../../apps/command/src/gen
    opt:
      - target=ts
