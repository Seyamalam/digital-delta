<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FAFAF6"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#216E75" stroke-width="1.3"/></marker></defs><path d="M280 197.5 L300 197.5 L300 197.5 L320 197.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M580 197.5 L600 197.5 L600 197.5 L620 197.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M880 197.5 L900 197.5 L900 197.5 L920 197.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="20" y="80" width="260" height="235" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="20" y="80" width="260" height="5" fill="#123D38"/><text x="37" y="112" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">01  DISCOVERY</text><text x="37" y="155" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Map the workflow</text><text x="37" y="192" font-family="Arial" font-size="22" fill="#576B6D">Find a sponsor and</text><text x="37" y="221" font-family="Arial" font-size="22" fill="#576B6D">operational owner.</text><text x="37" y="250" font-family="Arial" font-size="22" fill="#576B6D">Review procedures.</text><rect x="320" y="80" width="260" height="235" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="320" y="80" width="260" height="5" fill="#216E75"/><text x="337" y="112" font-family="Arial" font-size="18" font-weight="bold" fill="#216E75">02  AGREEMENT</text><text x="337" y="155" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Scope the exercise</text><text x="337" y="192" font-family="Arial" font-size="22" fill="#576B6D">Define data authority,</text><text x="337" y="221" font-family="Arial" font-size="22" fill="#576B6D">acceptance criteria</text><text x="337" y="250" font-family="Arial" font-size="22" fill="#576B6D">and cost.</text><rect x="620" y="80" width="260" height="235" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="620" y="80" width="260" height="5" fill="#216E75"/><text x="637" y="112" font-family="Arial" font-size="18" font-weight="bold" fill="#216E75">03  VALIDATION</text><text x="637" y="155" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Test performance</text><text x="637" y="192" font-family="Arial" font-size="22" fill="#576B6D">Test physical devices</text><text x="637" y="221" font-family="Arial" font-size="22" fill="#576B6D">and bilingual tasks</text><text x="637" y="250" font-family="Arial" font-size="22" fill="#576B6D">against a baseline.</text><rect x="920" y="80" width="260" height="235" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="920" y="80" width="260" height="5" fill="#123D38"/><text x="937" y="112" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">04  ADOPTION</text><text x="937" y="155" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Review evidence</text><text x="937" y="192" font-family="Arial" font-size="22" fill="#576B6D">Go, revise or stop.</text><text x="937" y="221" font-family="Arial" font-size="22" fill="#576B6D">Agree support before</text><text x="937" y="250" font-family="Arial" font-size="22" fill="#576B6D">expanding deployment.</text><text x="20" y="400" font-family="Arial" font-size="31" fill="#123D38">Entry offer: a supervised preparedness exercise</text><text x="20" y="454" font-family="Arial" font-size="24" fill="#576B6D">Revenue hypothesis: scoped setup and training, followed by agreed readiness support.</text><text x="20" y="510" font-family="Arial" font-size="23" fill="#A96827">No current contract, institutional endorsement or revenue is claimed.</text></svg>