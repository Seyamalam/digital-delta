ns</text><text x="447" y="269" font-family="Arial" font-size="22" fill="#576B6D">Budget authority to verify</text><rect x="840" y="70" width="345" height="270" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="840" y="70" width="345" height="5" fill="#123D38"/><text x="857" y="102" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">FIRST EXERCISE</text><text x="857" y="145" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">One referral chain</text><text x="857" y="182" font-family="Arial" font-size="22" fill="#576B6D">One sponsor</text><text x="857" y="211" font-family="Arial" font-size="22" fill="#576B6D">Experienced relief partner</text><text x="857" y="240" font-family="Arial" font-size="22" fill="#576B6D">Named operational owner</text><text x="857" y="269" font-family="Arial" font-size="22" fill="#576B6D">Bounded device cohort</text><text x="20" y="434" font-family="Arial" font-size="27" fill="#123D38">Bottom-up sizing follows verified organizations, budgets and purchase cycles.</text><text x="20" y="500" font-family="Arial" font-size="23" fill="#A96827">S03: NAWG June 2024 assessment. Revenue market size is not yet established.</text></svg>