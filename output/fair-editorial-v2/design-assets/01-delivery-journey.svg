<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FAFAF6"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#216E75" stroke-width="1.3"/></marker></defs><path d="M230 247.5 L244 247.5 L244 247.5 L258 247.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M468 247.5 L482 247.5 L482 247.5 L496 247.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M706 247.5 L720 247.5 L720 247.5 L734 247.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M944 247.5 L958 247.5 L958 247.5 L972 247.5" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="20" y="115" width="210" height="265" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="20" y="115" width="210" height="5" fill="#123D38"/><text x="37" y="147" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">01  CLINIC</text><text x="37" y="190" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Save request</text><text x="37" y="227" font-family="Arial" font-size="22" fill="#576B6D">Save the request</text><text x="37" y="256" font-family="Arial" font-size="22" fill="#576B6D">on the phone.</text><rect x="258" y="115" width="210" height="265" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="258" y="115" width="210" height="5" fill="#123D38"/><text x="275" y="147" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">02  RELAY</text><text x="275" y="190" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Carry record</text><text x="275" y="227" font-family="Arial" font-size="22" fill="#576B6D">Persist encrypted</text><text x="275" y="256" font-family="Arial" font-size="22" fill="#576B6D">bytes. Forward</text><text x="275" y="285" font-family="Arial" font-size="22" fill="#576B6D">when peers meet.</text><rect x="496" y="115" width="210" height="265" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="496" y="115" width="210" height="5" fill="#216E75"/><text x="513" y="147" font-family="Arial" font-size="18" font-weight="bold" fill="#216E75">03  ROUTE</text><text x="513" y="190" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Reroute</text><text x="513" y="227" font-family="Arial" font-size="22" fill="#576B6D">A simulated road</text><text x="513" y="256" font-family="Arial" font-size="22" fill="#576B6D">failure selects</text><text x="513" y="285" font-family="Arial" font-size="22" fill="#576B6D">a boat path.</text><rect x="734" y="115" width="210" height="265" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="734" y="115" width="210" height="5" fill="#A96827"/><text x="751" y="147" font-family="Arial" font-size="18" font-weight="bold" fill="#A96827">04  DECISION</text><text x="751" y="190" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Review</text><text x="751" y="227" font-family="Arial" font-size="22" fill="#576B6D">A coordinator</text><text x="751" y="256" font-family="Arial" font-size="22" fill="#576B6D">reviews the</text><text x="751" y="285" font-family="Arial" font-size="22" fill="#576B6D">proposed change.</text><rect x="972" y="115" width="210" height="265" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="972" y="115" width="210" height="5" fill="#123D38"/><text x="989" y="147" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">05  RECIPIENT</text><text x="989" y="190" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Sign receipt</text><text x="989" y="227" font-family="Arial" font-size="22" fill="#576B6D">Verify once.</text><text x="989" y="256" font-family="Arial" font-size="22" fill="#576B6D">Reject replay</text><text x="989" y="285" font-family="Arial" font-size="22" fill="#576B6D">and tampering.</text><text x="20" y="470" font-family="Arial" font-size="29" fill="#123D38">A conceptual walkthrough across demonstrated modules</text><text x="20" y="520" font-family="Arial" font-size="23" fill="#576B6D">Screenshots come from separate seeded captures. Physical end-to-end acceptance remains open.</text></svg>