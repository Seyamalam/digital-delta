<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FAFAF6"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#216E75" stroke-width="1.3"/></marker></defs><path d="M600 290 L600 350 L600 350 L600 410" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="20" y="60" width="340" height="230" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="20" y="60" width="340" height="5" fill="#123D38"/><text x="37" y="92" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">USES THE PRODUCT</text><text x="37" y="135" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Field operator</text><text x="37" y="172" font-family="Arial" font-size="22" fill="#576B6D">Records requests</text><text x="37" y="201" font-family="Arial" font-size="22" fill="#576B6D">Carries encrypted messages</text><text x="37" y="230" font-family="Arial" font-size="22" fill="#576B6D">Verifies a handoff</text><rect x="430" y="60" width="340" height="230" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="430" y="60" width="340" height="5" fill="#216E75"/><text x="447" y="92" font-family="Arial" font-size="18" font-weight="bold" fill="#216E75">APPROVES ADOPTION</text><text x="447" y="135" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Institutional sponsor</text><text x="447" y="172" font-family="Arial" font-size="22" fill="#576B6D">Government or NGO team</text><text x="447" y="201" font-family="Arial" font-size="22" fill="#576B6D">Budget and procurement</text><text x="447" y="230" font-family="Arial" font-size="22" fill="#576B6D">Named operational owner</text><rect x="840" y="60" width="340" height="230" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="840" y="60" width="340" height="5" fill="#123D38"/><text x="857" y="92" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">RECEIVES THE BENEFIT</text><text x="857" y="135" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Community</text><text x="857" y="172" font-family="Arial" font-size="22" fill="#576B6D">Continuity of supply records</text><text x="857" y="201" font-family="Arial" font-size="22" fill="#576B6D">Accountable delivery</text><text x="857" y="230" font-family="Arial" font-size="22" fill="#576B6D">Outcomes to be measured</text><rect x="280" y="410" width="640" height="150" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="280" y="410" width="640" height="5" fill="#123D38"/><text x="297" y="442" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">DEPLOYMENT RESPONSIBILITY</text><text x="297" y="485" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Keep the system ready between events</text><text x="297" y="522" font-family="Arial" font-size="22" fill="#576B6D">Training, devices, maps, credentials and support</text><text x="20" y="30" font-family="Arial" font-size="24" fill="#A96827">Buyer hypothesis. Interviews and willingness to pay remain unvalidated.</text></svg>