<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#FAFAF6"/><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 L6 3.5 L0 7" fill="none" stroke="#216E75" stroke-width="1.3"/></marker></defs><path d="M345 245 L392.5 245 L392.5 170 L440 170" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><path d="M765 170 L810 170 L810 245 L855 245" stroke="#216E75" stroke-width="3" fill="none"  marker-end="url(#arrow)"/><rect x="30" y="120" width="315" height="250" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="30" y="120" width="315" height="5" fill="#123D38"/><text x="47" y="152" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">SENDER</text><text x="47" y="195" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Seal the event</text><text x="47" y="232" font-family="Arial" font-size="22" fill="#576B6D">Protobuf bytes</text><text x="47" y="261" font-family="Arial" font-size="22" fill="#576B6D">Recipient encryption</text><text x="47" y="290" font-family="Arial" font-size="22" fill="#576B6D">Signed envelope</text><rect x="440" y="60" width="325" height="220" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="440" y="60" width="325" height="5" fill="#216E75"/><text x="457" y="92" font-family="Arial" font-size="18" font-weight="bold" fill="#216E75">RELAY CAN CHECK</text><text x="457" y="135" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Forwarding metadata</text><text x="457" y="172" font-family="Arial" font-size="22" fill="#576B6D">IDs and destination</text><text x="457" y="201" font-family="Arial" font-size="22" fill="#576B6D">Expiry and hop limits</text><text x="457" y="230" font-family="Arial" font-size="22" fill="#576B6D">Envelope integrity</text><rect x="440" y="345" width="325" height="200" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="440" y="345" width="325" height="5" fill="#123D38"/><text x="457" y="377" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">RELAY CANNOT OPEN</text><text x="457" y="420" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Delivery payload</text><text x="457" y="457" font-family="Arial" font-size="22" fill="#576B6D">Recipient encryption</text><text x="457" y="486" font-family="Arial" font-size="22" fill="#576B6D">protects the contents.</text><rect x="855" y="120" width="315" height="250" fill="#FFFFFF" stroke="#BCCDC6" stroke-width="1.2"/><rect x="855" y="120" width="315" height="5" fill="#123D38"/><text x="872" y="152" font-family="Arial" font-size="18" font-weight="bold" fill="#123D38">RECIPIENT</text><text x="872" y="195" font-family="Arial" font-size="26" font-weight="bold" fill="#172E2B">Open and verify</text><text x="872" y="232" font-family="Arial" font-size="22" fill="#576B6D">Decrypt with own key</text><text x="872" y="261" font-family="Arial" font-size="22" fill="#576B6D">Verify trusted fields</text><text x="872" y="290" font-family="Arial" font-size="22" fill="#576B6D">Apply accepted event</text><text x="35" y="460" font-family="Arial" font-size="24" fill="#123D38">AES-256-GCM payload encryption</text><text x="35" y="502" font-family="Arial" font-size="23" fill="#576B6D">RSA-OAEP recipient key wrapping</text><text x="845" y="460" font-family="Arial" font-size="23" fill="#216E75">Persist before acknowledgement</text><text x="845" y="502" font-family="Arial" font-size="23" fill="#576B6D">Receipt ≠ domain acceptance</text></svg>