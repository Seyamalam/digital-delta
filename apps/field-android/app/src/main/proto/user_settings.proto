syntax = "proto3";

package digitaldelta.settings.v1;

option java_package = "com.example.digitaldelta.settings.v1";
option java_multiple_files = true;
option optimize_for = LITE_RUNTIME;

enum InterfaceLanguage {
  INTERFACE_LANGUAGE_UNSPECIFIED = 0;
  INTERFACE_LANGUAGE_BANGLA = 1;
  INTERFACE_LANGUAGE_ENGLISH = 2;
}

message UserSettings {
  InterfaceLanguage interface_language = 1;
  bytes trusted_issuer_public_key_der = 2;
  string trusted_issuer_fingerprint = 3;
  string local_device_profile_code = 4;
}
